name: Claude Code PR review channel

on:
  workflow_call:
    inputs:
      runner_labels:
        description: JSON array of labels for a trusted Linux runner; use self-hosted only on a trusted runner pool.
        type: string
        default: '["ubuntu-latest"]'
      model:
        description: Claude CLI model; overrides the caller repository or organization OCR_MODEL variable.
        type: string
        default: ''
      gateway_url:
        description: HTTPS gateway URL; falls back to the caller repository or organization OCR_GATEWAY_URL variable.
        type: string
        default: ''
      claude_version:
        description: Exact Claude Code npm version, not a moving tag or version range.
        type: string
        default: '2.1.285'
      effort:
        description: OCR review effort (low, medium, high).
        type: string
        default: high
      review_concurrency:
        description: Maximum parallel OCR review tasks within this run.
        type: string
        default: '1'
      llm_timeout:
        description: Per-request LLM timeout in integer seconds, from 1 through 7200.
        type: string
        default: '300'
      review_task_timeout:
        description: Per-file/concurrent-task timeout in integer minutes, from 1 through 120; the job deadline still applies.
        type: string
        default: '30'
      max_tokens_budget:
        description: Aggregate token dispatch budget; active groups may finish above it, and incomplete reviews fail the check.
        type: string
        default: '1500000'
    secrets:
      gateway_token:
        description: Gateway credential passed only to the worker's review step.
        required: true
    outputs:
      summary_comment_url:
        description: URL of the PR review summary.
        value: ${{ jobs.review.outputs.summary_comment_url }}

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Only internal, human-authored, non-draft pull_request_target events may spend quota.
    if: >-
      github.event_name == 'pull_request_target' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    # Keep uses and source_sha pinned to the same commit when updating this channel.
    uses: vocdoni/open-code-review/.github/workflows/claude-review.yml@e7b03bf148c136c2b73a30cbc3f0e7149b572d9e
    with:
      source_repository: vocdoni/open-code-review
      source_sha: e7b03bf148c136c2b73a30cbc3f0e7149b572d9e
      runner_labels: ${{ inputs.runner_labels }}
      model: ${{ inputs.model }}
      gateway_url: ${{ inputs.gateway_url }}
      claude_version: ${{ inputs.claude_version }}
      effort: ${{ inputs.effort }}
      review_concurrency: ${{ inputs.review_concurrency }}
      llm_timeout: ${{ inputs.llm_timeout }}
      review_task_timeout: ${{ inputs.review_task_timeout }}
      max_tokens_budget: ${{ inputs.max_tokens_budget }}
    secrets:
      gateway_token: ${{ secrets.gateway_token }}
